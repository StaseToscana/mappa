name: Aggiorna sagre (Terre di Pisa)

on:
  schedule:
    - cron: '30 4 * * *'        # ogni giorno alle 4:30 UTC, prima di Firenze (5:15) e VisitTuscany (6:00)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo prova (non scrive file, legge 15 schede)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: aggiorna-sagre
  cancel-in-progress: false

env:
  TZ: Europe/Rome

jobs:
  sagre:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa dipendenze Python
        run: pip install requests beautifulsoup4

      - name: Scraper sagre (solo titolo, date, luogo)
        timeout-minutes: 25
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -u scripts/scrape_sagre.py --dry-run --max 15
          else
            python -u scripts/scrape_sagre.py
          fi

      - name: Foto dei luoghi (Wikimedia Commons)
        # Stesso script di Firenze, cache separata. Non blocca mai l'aggiornamento degli eventi.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          mkdir -p dati foto-luoghi
          node scripts/foto-luoghi.js eventi_sagre.json dati/foto_luoghi_sagre.json foto-luoghi

      - name: Immagine illustrativa per tema (piano B)
        # Solo per gli eventi ancora senza immagine. Usa i file nella cartella immagini-sagre/.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          mkdir -p immagini-sagre
          node scripts/immagine-tema.js eventi_sagre.json immagini-sagre

      - name: Commit e push
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          mkdir -p dati foto-luoghi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventi_sagre.json geocode_cache.json cache_pagine.json
          git add -A dati foto-luoghi
          if git diff --cached --quiet; then
            echo "Nessuna modifica."
          else
            git commit -m "Aggiorna sagre $(date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

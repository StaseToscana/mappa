name: Aggiorna sagre (Sagre Autentiche)

on:
  schedule:
    - cron: '15 4 * * *'        # ogni giorno alle 4:15 UTC, fra Portale Eventi e Terre di Pisa
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo prova (non scrive file)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: aggiorna-sagreautentiche
  cancel-in-progress: false

env:
  TZ: Europe/Rome

jobs:
  sagreautentiche:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa dipendenze Python
        run: pip install requests

      - name: Scraper Sagre Autentiche (solo titolo, date, luogo)
        timeout-minutes: 10
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -u scripts/scrape_sagreautentiche.py --dry-run
          else
            python -u scripts/scrape_sagreautentiche.py
          fi

      - name: Foto dei luoghi (Wikimedia Commons)
        # Stesso script degli altri, cache separata. Non blocca mai l'aggiornamento.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          mkdir -p dati foto-luoghi
          node scripts/foto-luoghi.js eventi_sagreautentiche.json dati/foto_luoghi_sagreautentiche.json foto-luoghi

      - name: Foto dei paesi (Wikimedia Commons)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          mkdir -p dati foto-luoghi
          node scripts/foto-paesi.js eventi_sagreautentiche.json dati/foto_paesi_sagreautentiche.json foto-luoghi

      - name: Immagine illustrativa per tema (piano B)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          mkdir -p immagini-sagre
          node scripts/immagine-tema.js eventi_sagreautentiche.json immagini-sagre

      - name: Commit e push
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          mkdir -p dati foto-luoghi immagini-sagre
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventi_sagreautentiche.json
          git add -A dati foto-luoghi immagini-sagre
          if git diff --cached --quiet; then
            echo "Nessuna modifica."
          else
            git commit -m "Aggiorna sagre Sagre Autentiche $(date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

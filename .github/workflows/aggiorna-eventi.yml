name: Aggiorna Eventi VisitTuscany

on:
  schedule:
    - cron: '0 6 * * *'  # ogni giorno alle 6:00 del mattino
  workflow_dispatch:  # permette di lanciare manualmente cliccando un bottone

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Ricrea il certificato dal segreto
        run: |
          echo "${{ secrets.P12_CERTIFICATE }}" | base64 -d > certificato.p12

      - name: Estrai certificato e chiave privata
        run: |
          openssl pkcs12 -in certificato.p12 -out certificato.pem -nodes -password pass:"${{ secrets.P12_PASSWORD }}"

      - name: Chiama VisitTuscany e scarica gli eventi
        run: |
          curl -f -s --cert certificato.pem --key certificato.pem \
            "${{ secrets.API_URL }}" \
            -H "Accept: application/json" \
            -o eventi_visittuscany.json
        continue-on-error: true

      - name: Salva il file nel repository
        run: |
          git config user.name "Robot Eventi"
          git config user.email "robot@stasetoscana.it"
          git add eventi_visittuscany.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Aggiornamento eventi $(date +%d-%m-%Y)"
          git push

name: Aggiorna Eventi VisitTuscany

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Ricrea il certificato dal segreto
        run: |
          echo "${{ secrets.P12_CERTIFICATE }}" | base64 -d > certificato.p12

      - name: Estrai certificato e chiave privata
        run: |
          openssl pkcs12 -in certificato.p12 -out cert.pem -nokeys -password pass:"${{ secrets.P12_PASSWORD }}"
          openssl pkcs12 -in certificato.p12 -out key.pem -nocerts -nodes -password pass:"${{ secrets.P12_PASSWORD }}"

      - name: Scarica eventi da VisitTuscany (paginazione)
        run: |
          mkdir -p vt_pages

          for page in $(seq 1 200); do
            echo "Scarico pagina $page..."

            HTTP_CODE=""
            TENTATIVO=1
            MAX_TENTATIVI=3

            while [ "$TENTATIVO" -le "$MAX_TENTATIVI" ]; do
              HTTP_CODE=$(curl -s -o "vt_pages/page_${page}.json" -w "%{http_code}" \
                --cert cert.pem --key key.pem \
                "${{ secrets.API_URL }}?page=${page}&limit=100" \
                -H "Accept: application/json" \
                -L --max-time 60)

              if [ "$HTTP_CODE" = "200" ]; then
                break
              fi

              echo "  Tentativo $TENTATIVO: HTTP $HTTP_CODE, riprovo tra 5s..."
              rm -f "vt_pages/page_${page}.json"
              sleep 5
              TENTATIVO=$((TENTATIVO + 1))
            done

            echo "  HTTP code finale: $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "  Pagina $page: HTTP $HTTP_CODE dopo $MAX_TENTATIVI tentativi (fine dati o errore persistente)"
              rm -f "vt_pages/page_${page}.json"
              break
            fi

            COUNT=$(python3 -c "import json; d=json.load(open('vt_pages/page_${page}.json')); print(len(d.get('response',{}).get('data',{}).get('doc',[])))" 2>/dev/null || echo "0")
            echo "  Eventi nella pagina: $COUNT"
            if [ "$COUNT" = "0" ]; then
              echo "  Pagina $page: 0 eventi"
              rm -f "vt_pages/page_${page}.json"
              break
            fi
          done

      - name: Unisci tutte le pagine in un unico JSON
        run: |
          python3 << 'PYEOF'
          import json, glob, os, sys
          from datetime import date, datetime

          def durata_giorni(start, end):
              """Calcola durata in giorni (inclusivo)."""
              if not start or not end:
                  return 0
              try:
                  d1 = datetime.strptime(start, '%Y-%m-%d').date()
                  d2 = datetime.strptime(end, '%Y-%m-%d').date()
                  return (d2 - d1).days + 1
              except:
                  return 0

          eventi = []
          files = sorted(glob.glob("vt_pages/page_*.json"))
          print(f"File trovati: {len(files)}")

          for f in files:
              with open(f) as fp:
                  d = json.load(fp)
              docs = d.get('response', {}).get('data', {}).get('doc', [])
              eventi.extend(docs)

          print(f"Eventi totali scaricati: {len(eventi)}")

          # Salva raw senza filtri per debug
          output_raw = {"response": {"data": {"doc": eventi}}}
          with open("eventi_visittuscany_raw.json", "w") as out:
              json.dump(output_raw, out, ensure_ascii=False)
          print(f"Salvato RAW: {len(eventi)} eventi")

          # Filtra:
          # 1. Eventi futuri: almeno un periodo con endDate >= oggi
          # 2. Durata max 40 giorni (scarta mostre/festival lunghissimi)
          oggi = date.today().isoformat()
          futuri = []
          scartati = 0
          scartati_lunghi = 0

          for ev in eventi:
              periods = ev.get('periods', [])
              is_futuro = False
              durata = 0

              if periods and len(periods) > 0:
                  p = periods[0]
                  start = p.get('startDate', '9999-12-31')
                  end = p.get('endDate', start)
                  durata = durata_giorni(start, end)
                  if end >= oggi:
                      is_futuro = True
              else:
                  # Se non ha periodi, consideriamolo futuro per sicurezza
                  is_futuro = True

              if is_futuro and durata <= 40:
                  futuri.append(ev)
              else:
                  scartati += 1
                  if durata > 40:
                      scartati_lunghi += 1

          print(f"Eventi futuri (endDate >= {oggi}): {len(futuri)}")
          print(f"Eventi scartati (totali): {scartati}")
          print(f"Eventi scartati (durata > 40 gg): {scartati_lunghi}")

          # --- CONTROLLO DI SICUREZZA ANTI-SVUOTAMENTO ---
          # Se il download è fallito/parziale, non sovrascrivere il file buono già pubblicato.
          SOGLIA_MINIMA = 10  # sotto questo numero, sospettiamo un fallimento del download

          esistente_count = 0
          if os.path.exists("eventi_visittuscany.json"):
              try:
                  with open("eventi_visittuscany.json") as fp:
                      esistente = json.load(fp)
                  esistente_count = len(esistente.get('response', {}).get('data', {}).get('doc', []))
              except Exception as e:
                  print(f"Attenzione: impossibile leggere il file esistente: {e}")

          print(f"Eventi nel file esistente: {esistente_count}")

          if len(futuri) < SOGLIA_MINIMA and esistente_count >= SOGLIA_MINIMA:
              print(f"❌ ERRORE: solo {len(futuri)} eventi scaricati (soglia minima {SOGLIA_MINIMA}), "
                    f"ma il file esistente ne aveva {esistente_count}. "
                    "Probabile fallimento del download da VisitTuscany. "
                    "NON sovrascrivo il file esistente. Il job fallisce volutamente.")
              sys.exit(1)

          output = {"response": {"data": {"doc": futuri}}}
          with open("eventi_visittuscany.json", "w") as out:
              json.dump(output, out, ensure_ascii=False)
          print(f"Salvato FILTRATO: {len(futuri)} eventi")
          PYEOF

      - name: Rigenera le pagine statiche per provincia
        run: python3 generator/genera_pagine_province.py

      - name: Salva nel repository
        run: |
          git config user.name "Robot Eventi"
          git config user.email "robot@stasetoscana.it"
          git add eventi_visittuscany.json eventi_visittuscany_raw.json eventi-*.html eventi-in-toscana.html
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Aggiornamento eventi VisitTuscany $(date +%d-%m-%Y)"
            git push
          fi
